services:
  - type: web
    name: machine-never-miss
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: DEMO_KEY
        sync: false
      - key: HINDSIGHT_BANK
        value: machine-never-miss
